<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview - Painel de Rastreamento</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="layout" id="layout"></div>

<script src="/comum.js"></script>
<script>
document.getElementById('layout').innerHTML = montarSidebar() + `
  <div class="conteudo">
    ${montarTopbar('Overview')}
    <main>
      <div class="cards">
        <div class="card"><div class="label">Investido (total)</div><div class="valor" id="cInvestido">--</div></div>
        <div class="card"><div class="label">Faturamento</div><div class="valor verde" id="cFaturamento">--</div></div>
        <div class="card"><div class="label">ROAS</div><div class="valor" id="cRoas">--</div></div>
        <div class="card"><div class="label">Lucro</div><div class="valor" id="cLucro">--</div></div>
      </div>

      <div class="painel secao">
        <div class="painel-titulo">Evolução no período</div>
        <div style="padding:16px;">
          <svg id="grafico" width="100%" height="220" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg>
        </div>
      </div>

      <div class="cards">
        <div class="card"><div class="label">Leads</div><div class="valor" id="cLeads">--</div></div>
        <div class="card"><div class="label">CPL</div><div class="valor" id="cCpl">--</div></div>
        <div class="card"><div class="label">Vendas</div><div class="valor" id="cVendas">--</div></div>
        <div class="card"><div class="label">CPA</div><div class="valor" id="cCpa">--</div></div>
      </div>

      <div class="cards">
        <div class="card"><div class="label">Agendamentos (Pay After Delivery)</div><div class="valor" id="cAgendamentos">--</div></div>
        <div class="card"><div class="label">Faturamento agendado</div><div class="valor" id="cFatAgendado">--</div></div>
      </div>
    </main>
  </div>
`;

async function carregar() {
  const inicio = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const qs = `?data_inicio=${inicio}&data_fim=${fim}`;

  const [totais, funil, serie] = await Promise.all([
    fetch('/api/dashboard/totais' + qs).then(r => r.json()),
    fetch('/api/dashboard/funil' + qs).then(r => r.json()),
    fetch('/api/dashboard/serie-diaria' + qs).then(r => r.json()),
  ]);

  document.getElementById('cInvestido').textContent = formatarMoeda(totais.gasto_total);
  document.getElementById('cFaturamento').textContent = formatarMoeda(totais.faturamento_total);
  document.getElementById('cRoas').textContent = totais.roas_geral ? totais.roas_geral + 'x' : '--';
  const lucro = totais.faturamento_total - totais.gasto_total;
  const lucroEl = document.getElementById('cLucro');
  lucroEl.textContent = formatarMoeda(lucro);
  lucroEl.className = 'valor ' + (lucro >= 0 ? 'verde' : 'vermelho');

  document.getElementById('cLeads').textContent = funil.leads;
  document.getElementById('cCpl').textContent = funil.cpl !== null ? formatarMoeda(funil.cpl) : '--';
  document.getElementById('cVendas').textContent = funil.vendas;
  document.getElementById('cCpa').textContent = funil.cpa !== null ? formatarMoeda(funil.cpa) : '--';
  document.getElementById('cAgendamentos').textContent = funil.agendamentos;
  document.getElementById('cFatAgendado').textContent = formatarMoeda(funil.faturamento_agendado);

  desenharGrafico(serie);
}

function desenharGrafico(serie) {
  const svg = document.getElementById('grafico');
  if (!serie || serie.length === 0) { svg.innerHTML = ''; return; }

  const maxValor = Math.max(...serie.map(d => Math.max(parseFloat(d.gasto), parseFloat(d.faturamento))), 1);
  const largura = 1000, altura = 220, margem = 10;
  const passoX = (largura - margem * 2) / Math.max(serie.length - 1, 1);

  const pontos = (campo) => serie.map((d, i) => {
    const x = margem + i * passoX;
    const y = altura - margem - ((parseFloat(d[campo]) / maxValor) * (altura - margem * 2));
    return `${x},${y}`;
  }).join(' ');

  svg.innerHTML = `
    <polyline points="${pontos('gasto')}" fill="none" stroke="#ff8b8b" stroke-width="2" />
    <polyline points="${pontos('faturamento')}" fill="none" stroke="#4ade80" stroke-width="2" />
  `;
}

iniciarFiltrosDeData(carregar);
window.sincronizarAgora = async () => {
  await fetch('/api/dashboard/sincronizar-agora', { method: 'POST' });
  carregar();
};
carregar();
</script>
</body>
</html>
